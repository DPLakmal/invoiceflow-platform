version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: invoiceflow_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoiceflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoiceflow_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-invoiceflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invoiceflow} -d ${POSTGRES_DB:-invoiceflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis Message Broker & Result Backend
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: invoiceflow_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # FastAPI Backend API Server
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoiceflow_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-invoiceflow-secret-key-2026}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-invoiceflow}:${POSTGRES_PASSWORD:-invoiceflow_secure_password}@postgres:5432/${POSTGRES_DB:-invoiceflow_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=["http://localhost:4200","http://localhost:80","http://localhost"]
    volumes:
      - ./backend:/app
      - invoice_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==========================================
  # Celery Background Worker
  # ==========================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: invoiceflow_worker
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER:-invoiceflow}:${POSTGRES_PASSWORD:-invoiceflow_secure_password}@postgres:5432/${POSTGRES_DB:-invoiceflow_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./backend:/app
      - invoice_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==========================================
  # Celery Flower (Task Monitoring Web UI)
  # ==========================================
  celery_flower:
    image: mher/flower:2.0
    container_name: invoiceflow_flower
    restart: always
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555
    depends_on:
      redis:
        condition: service_healthy

  # ==========================================
  # Angular Frontend (Served via Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invoiceflow_frontend
    restart: always
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  invoice_uploads:
    driver: local
